        Change Management
        This collection targets a locally-running server. Breaking changes to the API (e.g. renamed fields, removed endpoints, changed status codes) should be:
        Reflected in the request bodies and URLs in this collection.
        Noted in the collection description or a linked workspace document.
        Communicated to any consumers before deployment to shared environments.

        If the API is versioned (e.g. /api/v2/products/), create a separate collection or folder per version rather than overwriting existing requests.


