docs:
    content: |+
        Products API
        Overview
        The Products API is a RESTful service for managing a product catalog. It supports full CRUD operations — listing all products, fetching a single product by ID, creating new products, partially updating existing ones, and deleting them. The API is intended for internal use by front-end clients and back-end services that need to read or mutate product data.
        Each product conforms to the following shape:
        FieldTypeDescriptionid





        number





        Unique product identifier





        title





        string





        Product display name





        price





        number





        Price in the smallest currency unit (e.g. IDR)





        image





        string





        URL to the product image





        rating





        number





        Aggregate customer rating (0–5)





        description





        string





        Long-form product description





        category





        string





        Product category (e.g. Kitchen Appliances)





        brand





        string





        Manufacturer or brand name





        discount





        number





        Discount percentage (0–100)









        Quick Start
        The minimal flow to verify the API is working:
        List all products — GET /api/products/ — confirms the server is up and returns the catalog.
        Fetch one product — GET /api/products/1 — confirms single-resource lookup works.
        Create a product — POST /api/products/ with a JSON body — confirms write access.



        Plain Text








        GET http://localhost:3000/api/products/


        A 200 OK with a JSON array means the service is healthy.



        Authentication
        No authentication is currently configured on this collection. All requests inherit auth from the collection level, which is set to No Auth. If the API is secured in a future environment, add a Bearer token or API key at the collection level and reference it as {{api_key}} in the Authorization header:


        Plain Text








        Authorization: Bearer {{api_key}}


        Never paste real tokens into the collection — store them as secret variables in the active environment.



        Environments
        Two environments are available in this workspace (env). Before running requests, select the appropriate environment from the environment picker in the top-right corner of Postman.
        Use one environment for local development (base URL: http://localhost:3000).
        Use a separate environment for staging or production with the deployed base URL.

        Consider extracting the base URL into an environment variable (e.g. {{base_url}}) and updating all request URLs to use {{base_url}}/api/products/ so you can switch targets without editing individual requests.
        Tip: Mark any sensitive values (tokens, secrets) as Secret in the environment editor so they are not synced to the cloud in plain text.



